[workspace]
resolver = "2"
members = [
    "crates/aaron-core",
    "crates/aaron-resources",
    "crates/aaron-security",
    "crates/aaron-memory",
    "crates/aaron-tools",
    "crates/aaron-brain",
    "crates/aaron-audio",
    "crates/aaron-wake",
    "crates/aaron-asr",
    "crates/aaron-tts",
    "crates/aaron-agent",
    "crates/aaron-learning",
    "crates/aaron-bench",
    "crates/aaron-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["AARON contributors"]
repository = "https://github.com/aaron-assistant/aaron"

[workspace.dependencies]
aaron-core = { path = "crates/aaron-core", version = "0.1.0" }
aaron-resources = { path = "crates/aaron-resources", version = "0.1.0" }
aaron-security = { path = "crates/aaron-security", version = "0.1.0" }
aaron-memory = { path = "crates/aaron-memory", version = "0.1.0" }
aaron-tools = { path = "crates/aaron-tools", version = "0.1.0" }
aaron-brain = { path = "crates/aaron-brain", version = "0.1.0" }
# `default-features = false` here, not in the members: Cargo only lets a
# member *keep* the workspace default, so the workspace declaration is
# the only place where "capture is opt-in" can actually be expressed.
# `aaron-app` turns it on explicitly through its own `capture` feature.
aaron-audio = { path = "crates/aaron-audio", version = "0.1.0", default-features = false }
aaron-wake = { path = "crates/aaron-wake", version = "0.1.0" }
aaron-asr = { path = "crates/aaron-asr", version = "0.1.0" }
aaron-tts = { path = "crates/aaron-tts", version = "0.1.0" }
aaron-agent = { path = "crates/aaron-agent", version = "0.1.0" }
aaron-learning = { path = "crates/aaron-learning", version = "0.1.0" }
aaron-bench = { path = "crates/aaron-bench", version = "0.1.0" }

anyhow = "=1.0.104"
thiserror = "=2.0.21"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
toml = "=0.8.23"
clap = { version = "=4.6.7", features = ["derive", "env", "wrap_help"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json", "std"] }
regex = "=1.12.3"
walkdir = "=2.5.0"
libc = "=0.2.186"
sha2 = "=0.10.9"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
cpal = "=0.18.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Benchmarks run against a debug-friendly but optimised profile so that
# `cargo bench --workspace` works without a nightly toolchain.
[profile.bench]
opt-level = 3